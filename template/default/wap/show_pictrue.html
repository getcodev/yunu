<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <meta name="keywords" content="<yunu:config name='seo_keywords'>">
    <meta name="description" content="<yunu:config name='seo_description'>">
    <title>{$content.title}-<yunu:config name="site_title"></title>
    <script type="text/javascript" src="__PUBLIC__/js/jquery-1.12.4.min.js"></script>
    <link rel="stylesheet" href="__PUBLIC__/css/yunu.css">
    <link rel="stylesheet" href="__PUBLIC__/css/font-awesome.min.css">
    <script type="text/javascript" src="__PUBLIC__/js/yunu.js"></script>
</head>
<body>
<include file="public:header" />
    <div class="main container">
    	<div class="i_box_tit">
            <span></span>
            <p>{$category.title}<neq name="$category['subtitle']" value=""> / </neq>{$category.subtitle}</p>
        </div>
        <div class="content_tit">
            <h3>{$content.title}</h3>
            <p>
                <span>发布时间：{$content.create_time|date='Y-m-d',###}</span>
            </p>
        </div>
        <div class="content_des">
            <p>{$content.desc}</p>
        </div>
        <div class="content">
            <div class="show_img">
                <ul>
                    <li><img src="{$content.pic}" alt=""></li>
                </ul>
            </div>
            <div class="content_content">
                {$content.content}
            </div>
        </div>
        <div class="show_pages">
            <p>上一篇： {$content.prev}</p>
            <p>下一篇： {$content.next}</p>
        </div>
    </div>
<include file="public:footer" />
</body>
</html>
